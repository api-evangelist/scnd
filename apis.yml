name: Second (scnd)
description: >-
  Second (scnd) is a France-based SaaS platform for launching and scaling online
  service marketplaces, partner-discovery networks, and service-procurement
  solutions. Evolved from the open-source Cocorico marketplace project, Second
  helps companies buy, sell, and manage services online with native calendaring
  (when services are available), geolocation and geofencing (where services are
  available), and vendor management (with whom services are available). The
  platform covers KYC/KYB, escrow, pay-in and payouts, split payments, dynamic
  pricing and yield management, AI-driven search and vendor matching, and a
  headless, composable, RESTful API-driven architecture. It powers marketplaces
  for customers such as Accor, Allianz, Intersport, Siemens Energy, and Suez
  across dozens of countries, and is SOC 2 Type 2, ISO 27001, and GDPR compliant.
  Backed by Partech and 42CAP (EUR 4M raise).
